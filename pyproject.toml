[project]
name = "sdg-classifier"
version = "0.2.0"
description = "Multi-label classification of scientific abstracts by UN Sustainable Development Goal with DistilBERT"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nicolas Huber", email = "nicolas.huber.dev@gmail.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "iterative-stratification>=0.1.9",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "peft>=0.21.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
sdg-classifier = "sdg_classifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data", "output"]

[tool.ruff.lint]
# pycodestyle errors, Pyflakes, import sorting, pyupgrade, bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
